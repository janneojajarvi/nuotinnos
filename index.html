<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abc nuotinnin</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <link rel="icon" href="kuva.png">
    <link rel="apple-touch-icon" href="kuva.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/abcjs-audio.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  <header>
    <h1>ABC nuotinnin</h1>
    
    

   <div id="piano-input-container">
  <div class="input-row tools-row">
    <div class="button-group">
    <button type="button" class="dur-btn active" data-dur="1">1/4</button>
    <button type="button" class="dur-btn" data-dur="2">1/2</button>
    <button type="button" class="dur-btn" data-dur="/2">1/8</button>
    <button type="button" class="dur-btn" data-dur="/4">1/16</button>
    <button type="button" id="dot-btn" class="tool-btn">.</button>
    <!-- Oktaavinapit -->
<div class="button-group">
  <button type="button" id="oct-down-btn" class="tool-btn" title="Oktaavi alemmas">⬇️ 8vb</button>
  <button type="button" id="oct-up-btn" class="tool-btn" title="Oktaavi ylemmäs">⬆️ 8va</button>
</div>

</div>

  <!-- UUSI: Nuottiavainvalitsin ja Taktimerkit -->
    <div class="button-group">
      <select id="clefSelect" style="padding: 6px 10px; border-radius: 6px; font-weight: bold; border: 1px solid #ccc; background: white; cursor: pointer;">
        <option value="treble">🎼 G-avain</option>
        <option value="bass">𝄢 Basso-avain</option>
      </select>
      <button type="button" class="bar-btn tool-btn" data-bar="|">|</button>
      <button type="button" class="bar-btn tool-btn" data-bar=":">:</button>
    </div>
    
    <div class="button-group accent-group">
      <button type="button" class="acc-btn" data-acc="^">♯</button>
      <button type="button" class="acc-btn" data-acc="_">♭</button>
      <button type="button" class="acc-btn" data-acc="=">♮</button>
      <button type="button" id="backspace-btn" class="tool-btn" style="background: #fce4ec; border-color: #f06292;">⌫</button>
    </div>
  </div>
  
  </div>
  
  <div class="input-row piano-row small-notes">
    <button type="button" class="note-btn" data-note="c">c</button>
    <button type="button" class="note-btn" data-note="d">d</button>
    <button type="button" class="note-btn" data-note="e">e</button>
    <button type="button" class="note-btn" data-note="f">f</button>
    <button type="button" class="note-btn" data-note="g">g</button>
    <button type="button" class="note-btn" data-note="a">a</button>
    <button type="button" class="note-btn" data-note="b">b</button>
  </div>

  <div class="input-row piano-row">
    <button type="button" class="note-btn" data-note="C">C</button>
    <button type="button" class="note-btn" data-note="D">D</button>
    <button type="button" class="note-btn" data-note="E">E</button>
    <button type="button" class="note-btn" data-note="F">F</button>
    <button type="button" class="note-btn" data-note="G">G</button>
    <button type="button" class="note-btn" data-note="A">A</button>
    <button type="button" class="note-btn" data-note="B">B</button>
    <button type="button" class="note-btn space-btn" data-note="z">Tauko</button>
  </div>
</div>
    
    
  </header>

  <div class="search-section">
    <div style="position: relative;">
        <textarea id="searchQuery" 
                  placeholder="Esim: C C G G A A G2" 
                  inputmode="none" 
                  readonly></textarea>
        
        <button id="manual-edit-btn" 
                onclick="toggleManualEdit()" 
                style="position: absolute; right: 5px; top: 5px; background: none; border: none; font-size: 20px; cursor: pointer;">
            ✏️
        </button>
    </div>
    <div class="button-group">
      
<button id="clearSearch" style="margin-top: 10px; padding: 12px 20px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold;">🗑️ Tyhjennä</button>
    </div>
   
</div>
  

  
    <div id="audio-container">
  <div id="audio-controls" style="margin-top: 10px; display: none;">
    <button id="play-btn">Soita</button>
    <button id="stop-btn">Pysäytä</button>
    <div id="audio-status" style="display: inline-block; margin-left: 10px; font-size: 0.8em;"></div>
</div>
        <div class="tempo-container">
    <label for="tempoRange">Tempo: <span id="tempoDisplay">100</span> BPM</label>
    <input type="range" id="tempoRange" min="30" max="240" value="100">
</div>
        </div>
<div id="paper"></div>
  <div id="full-note-display">
   
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js"></script>
<script src="script.js"></script>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker rekisteröity'))
        .catch(err => console.log('SW rekisteröintivirhe', err));
}
</script>
<div id="hidden-paper" style="display:none"></div>
</body>
</html>
